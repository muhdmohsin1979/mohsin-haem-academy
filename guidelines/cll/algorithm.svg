<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1930" viewBox="0 0 1000 1930" role="img" aria-labelledby="title desc">
<title id="title">CLL v2.0 preview treatment decision algorithm</title>
<desc id="desc">First-line orientation and relapsed refractory sequencing, with NICE TA1173 pirtobrutinib and separate intolerance, progression, double-exposed and double-refractory pathways.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/></marker></defs>
<rect width="1000" height="1930" fill="#F8FAFC"/>
<rect x="0" y="0" width="1000" height="96" fill="#1B2A4A"/>
<rect x="720" y="0" width="280" height="96" fill="#C41E3A"/>
<text x="40" y="43" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#FFFFFF"><tspan x="40" dy="0" font-weight="700">CHRONIC LYMPHOCYTIC LEUKAEMIA</tspan></text>
<text x="40" y="75" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#FFFFFF"><tspan x="40" dy="0" font-weight="400">Treatment decision algorithm · MHA-CLL-2026-v2.0-preview</tspan></text>
<text x="860" y="55" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#FFFFFF"><tspan x="860" dy="0" font-weight="700">PROTECTED</tspan><tspan x="860" dy="23" font-weight="400">PREVIEW</tspan></text>
<rect x="40" y="125" width="920" height="108" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="125" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="153" width="920" height="14" fill="#1B2A4A"/>
<text x="56" y="153" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">1 · CONFIRM TREATMENT IS REQUIRED</tspan></text>
<text x="56" y="187" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">Treat only when iwCLL active-disease criteria are met.</tspan><tspan x="56" dy="22" font-weight="400">If criteria are not met: active monitoring; do not treat by stage or lymphocyte count alone.</tspan></text>
<path d="M500 233 L500 268" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="650" height="180" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="268" width="650" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="296" width="650" height="14" fill="#1B2A4A"/>
<text x="56" y="296" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">2 · BEFORE EACH TREATMENT LINE</tspan></text>
<text x="56" y="330" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">Record prior class, regimen, response, duration, reason for stopping and treatment-free interval.</tspan><tspan x="56" dy="22" font-weight="400">Repeat del(17p) FISH and TP53 sequencing; review fitness, renal function, TLS, infection,</tspan><tspan x="56" dy="22" font-weight="400">cardiac/bleeding risk, interactions, preference and access.</tspan></text>
<rect x="710" y="268" width="250" height="180" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="710" y="268" width="250" height="42" rx="14" fill="#C41E3A"/>
<rect x="710" y="296" width="250" height="14" fill="#C41E3A"/>
<text x="726" y="296" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="726" dy="0" font-weight="700">RICHTER SUSPECTED?</tspan></text>
<text x="726" y="330" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#1F2937"><tspan x="726" dy="0" font-weight="400">Sudden decline, high LDH</tspan><tspan x="726" dy="18" font-weight="400">or asymmetric growth:</tspan><tspan x="726" dy="18" font-weight="400">PET-CT + biopsy the most</tspan><tspan x="726" dy="18" font-weight="400">FDG-avid lesion.</tspan><tspan x="726" dy="18" font-weight="400">Use separate RT pathway;</tspan><tspan x="726" dy="18" font-weight="400">not ordinary R/R sequence.</tspan></text>
<path d="M690 358 L708 358" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M500 448 L500 471" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="471" width="920" height="146" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="471" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="499" width="920" height="14" fill="#1B2A4A"/>
<text x="56" y="499" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">3 · FIRST-LINE OR RELAPSED/REFRACTORY?</tspan></text>
<text x="56" y="533" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">FIRST-LINE: TP53-abnormal disease requires targeted therapy. BSH 2025 favours zanubrutinib or</tspan><tspan x="56" dy="22" font-weight="400">acalabrutinib; fixed-duration venetoclax–obinutuzumab is an alternative where eligible.</tspan><tspan x="56" dy="22" font-weight="400">R/R: classify intolerance, progression, retained class sensitivity, double exposure and double</tspan><tspan x="56" dy="22" font-weight="400">refractoriness before choosing the next treatment.</tspan></text>
<path d="M500 617 L500 645" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="25" y="645" width="950" height="570" rx="16" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
<text x="45" y="678" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1B2A4A"><tspan x="45" dy="0" font-weight="700">SIX INDEPENDENT R/R STATES · CLASSIFY BY EXPOSURE AND REASON FOR STOPPING</tspan></text>
<rect x="40" y="700" width="286" height="225" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="700" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="728" width="286" height="14" fill="#1B2A4A"/>
<text x="56" y="728" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">BTKi NAIVE</tspan></text>
<text x="56" y="762" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">After previous non-BTKi therapy:</tspan><tspan x="56" dy="22" font-weight="400">• acalabrutinib TA689; or</tspan><tspan x="56" dy="22" font-weight="400">• zanubrutinib TA931.</tspan><tspan x="56" dy="22" font-weight="400">Select by exact TA criteria,</tspan><tspan x="56" dy="22" font-weight="400">comorbidity, interactions and</tspan><tspan x="56" dy="22" font-weight="400">toxicity profile.</tspan></text>
<rect x="357" y="700" width="286" height="225" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="357" y="700" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="357" y="728" width="286" height="14" fill="#1B2A4A"/>
<text x="373" y="728" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="373" dy="0" font-weight="700">COVALENT-BTKi INTOLERANCE</tspan></text>
<text x="373" y="762" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="373" dy="0" font-weight="400">No progression:</tspan><tspan x="373" dy="22" font-weight="400">consider a better-tolerated</tspan><tspan x="373" dy="22" font-weight="400">covalent BTKi or switch class</tspan><tspan x="373" dy="22" font-weight="400">according to eligibility and</tspan><tspan x="373" dy="22" font-weight="400">preference.</tspan><tspan x="373" dy="22" font-weight="400">Do not call this resistant disease.</tspan></text>
<rect x="674" y="700" width="286" height="225" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="674" y="700" width="286" height="42" rx="14" fill="#C41E3A"/>
<rect x="674" y="728" width="286" height="14" fill="#C41E3A"/>
<text x="690" y="728" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="690" dy="0" font-weight="700">COVALENT-BTKi PROGRESSION</tspan></text>
<text x="690" y="762" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="690" dy="0" font-weight="400">If venetoclax naive: use a</tspan><tspan x="690" dy="22" font-weight="400">venetoclax-based NICE pathway</tspan><tspan x="690" dy="22" font-weight="400">when eligible.</tspan><tspan x="690" dy="22" font-weight="400">Pirtobrutinib TA1173 when its</tspan><tspan x="690" dy="22" font-weight="400">specific restriction is met.</tspan></text>
<rect x="40" y="955" width="286" height="235" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="955" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="983" width="286" height="14" fill="#1B2A4A"/>
<text x="56" y="983" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">RELAPSE OFF FIXED-DURATION</tspan></text>
<text x="56" y="1017" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">Previous response; relapse off therapy:</tspan><tspan x="56" dy="22" font-weight="400">consider BTKi or selected venetoclax</tspan><tspan x="56" dy="22" font-weight="400">retreatment after reviewing response</tspan><tspan x="56" dy="22" font-weight="400">and treatment-free interval.</tspan><tspan x="56" dy="22" font-weight="400">Do not retreat primary or active-</tspan><tspan x="56" dy="22" font-weight="400">treatment resistant disease routinely.</tspan></text>
<rect x="357" y="955" width="286" height="235" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="357" y="955" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="357" y="983" width="286" height="14" fill="#1B2A4A"/>
<text x="373" y="983" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="373" dy="0" font-weight="700">DOUBLE EXPOSED</tspan></text>
<text x="373" y="1017" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="373" dy="0" font-weight="400">Both covalent BTKi and venetoclax</tspan><tspan x="373" dy="22" font-weight="400">used, but not refractory to both:</tspan><tspan x="373" dy="22" font-weight="400">individualise by retained sensitivity,</tspan><tspan x="373" dy="22" font-weight="400">prior response and NICE eligibility.</tspan><tspan x="373" dy="22" font-weight="400">Do not automatically label double</tspan><tspan x="373" dy="22" font-weight="400">refractory.</tspan></text>
<rect x="674" y="955" width="286" height="235" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="674" y="955" width="286" height="42" rx="14" fill="#C41E3A"/>
<rect x="674" y="983" width="286" height="14" fill="#C41E3A"/>
<text x="690" y="983" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="690" dy="0" font-weight="700">DOUBLE REFRACTORY</tspan></text>
<text x="690" y="1017" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="690" dy="0" font-weight="400">Progression during both classes:</tspan><tspan x="690" dy="22" font-weight="400">early tertiary and trial referral.</tspan><tspan x="690" dy="22" font-weight="400">Use pirtobrutinib when TA1173 met.</tspan><tspan x="690" dy="22" font-weight="400">Cellular therapy/alloHCT only in</tspan><tspan x="690" dy="22" font-weight="400">highly selected specialist pathways.</tspan><tspan x="690" dy="22" font-weight="400">No proven comparative hierarchy.</tspan></text>
<rect x="40" y="1230" width="920" height="372" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="1230" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="1258" width="920" height="14" fill="#1B2A4A"/>
<text x="56" y="1258" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">NICE RECOMMENDATIONS AND NHS ENGLAND ACCESS · 26 JULY 2026</tspan></text>
<text x="56" y="1292" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">Evidence, marketing authorisation, NICE recommendation and NHS funding are separate determinations.</tspan><tspan x="56" dy="22" font-weight="400">TA429  Ibrutinib · previously treated CLL and restricted untreated TP53-abnormal disease.</tspan><tspan x="56" dy="22" font-weight="400">TA689  Acalabrutinib · previously treated CLL and specified untreated populations.</tspan><tspan x="56" dy="22" font-weight="400">TA931  Zanubrutinib · R/R CLL and specified untreated populations.</tspan><tspan x="56" dy="22" font-weight="400">TA561  Venetoclax–rituximab · after at least one previous therapy.</tspan><tspan x="56" dy="22" font-weight="400">TA796  Venetoclax monotherapy: (a) del(17p)/TP53 when a B-cell receptor pathway inhibitor</tspan><tspan x="56" dy="22" font-weight="400">        is unsuitable, or after progression on one; or (b) no del(17p)/TP53 after progression</tspan><tspan x="56" dy="22" font-weight="400">        following both chemoimmunotherapy and a B-cell receptor pathway inhibitor.</tspan><tspan x="56" dy="22" font-weight="400">TA1173 Pirtobrutinib for adults with R/R CLL after a BTKi, ONLY when covalent-BTKi retreatment,</tspan><tspan x="56" dy="22" font-weight="400">        including after a fixed-duration regimen, is not clinically appropriate.</tspan><tspan x="56" dy="22" font-weight="400">At the cut-off, NHS England access remained through interim Blueteq funding; routine-budget</tspan><tspan x="56" dy="22" font-weight="400">implementation was due by 29 September 2026. The broader MHRA licence does not widen funding.</tspan><tspan x="56" dy="22" font-weight="400">England access is not a single UK-wide entitlement. Check SmPC, Blueteq and local policy.</tspan></text>
<rect x="40" y="1637" width="920" height="190" rx="14" fill="#FFF7E6" stroke="#C41E3A" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="40" y="1637" width="920" height="42" rx="14" fill="#C41E3A"/>
<rect x="40" y="1665" width="920" height="14" fill="#C41E3A"/>
<text x="56" y="1665" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="56" dy="0" font-weight="700">EMERGING / SPECIALIST · NOT ROUTINE NHS CLL TREATMENT</tspan></text>
<text x="56" y="1699" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="56" dy="0" font-weight="400">• Pirtobrutinib–venetoclax–rituximab: phase III evidence; NICE ID6566 awaiting development.</tspan><tspan x="56" dy="22" font-weight="400">• Lisocabtagene maraleucel: efficacy evidence, but no demonstrated CLL marketing authorisation,</tspan><tspan x="56" dy="22" font-weight="400">  NICE recommendation or routine NHS England commissioning; devolved-nation access not established.</tspan><tspan x="56" dy="22" font-weight="400">• CD20×CD3 bispecifics: no qualifying prospective therapeutic trial in untransformed CLL</tspan><tspan x="56" dy="22" font-weight="400">  identified through 26 July 2026; do not extrapolate Richter/other-lymphoma evidence.</tspan></text>
<text x="40" y="1862" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#5B6472"><tspan x="40" dy="0" font-weight="400">Clinical decision-support only · verify current NICE, NHS, MHRA, SmPC and local policy before prescribing.</tspan></text>
<text x="40" y="1890" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#C41E3A"><tspan x="40" dy="0" font-weight="400">Evidence cut-off 26 July 2026 · review and pharmacy verification complete · exact-artefact approval pending · not yet published.</tspan></text>
</svg>
