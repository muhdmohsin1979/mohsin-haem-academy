<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2050" viewBox="0 0 1000 2050" role="img" aria-labelledby="title desc">
<title id="title">MCL v2.0 treatment decision algorithm</title>
<desc id="desc">Non-public working preview showing diagnostic, first-line, high-risk, relapsed, cellular-therapy and access pathways for mantle cell lymphoma.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2A4A"/></marker></defs>
<rect width="1000" height="2050" fill="#F8FAFC"/>
<rect width="1000" height="105" fill="#1B2A4A"/>
<rect x="700" width="300" height="105" fill="#C41E3A"/>
<text x="38" y="44" data-semantic-id="header.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#FFFFFF"><tspan x="38" dy="0" font-weight="700">MANTLE CELL LYMPHOMA</tspan></text>
<text x="38" y="77" data-semantic-id="header.code" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#FFFFFF"><tspan x="38" dy="0" font-weight="400">MCL v2.0 treatment decision algorithm · MHA-MCL-2026-v2.0</tspan></text>
<text x="850" y="43" data-semantic-id="header.preview" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#FFFFFF"><tspan x="850" dy="0" font-weight="700">WORKING PREVIEW</tspan><tspan x="850" dy="22" font-weight="400">NOT FOR CLINICAL USE</tspan></text>
<rect x="40" y="130" width="920" height="130" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="130" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="158" width="920" height="14" fill="#1B2A4A"/>
<text x="55" y="158" data-semantic-id="node.diagnosis.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">1 · CONFIRM DIAGNOSIS AND DEFINE RISK</tspan></text>
<text x="55" y="193" data-semantic-id="node.diagnosis.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">Integrated morphology, immunophenotype and cyclin D1 / CCND-family confirmation.</tspan><tspan x="55" dy="21" font-weight="400">Record blastoid or pleomorphic morphology, Ki-67 and TP53 status where feasible.</tspan><tspan x="55" dy="21" font-weight="400">Define symptoms, tempo, organ compromise, cytopenias, fitness, frailty and goals.</tspan></text>
<path d="M500 260 L500 292" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="292" width="920" height="120" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="292" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="320" width="920" height="14" fill="#1B2A4A"/>
<text x="55" y="320" data-semantic-id="node.treat.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">2 · IS TREATMENT REQUIRED NOW?</tspan></text>
<text x="55" y="355" data-semantic-id="node.treat.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">No: selected asymptomatic low-volume, indolent or non-nodal disease may be observed after MDT review.</tspan><tspan x="55" dy="21" font-weight="400">Yes: document objective indication, patient priorities and the clinical and access pathway below.</tspan></text>
<path d="M500 412 L500 446" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="920" height="105" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="446" width="920" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="474" width="920" height="14" fill="#1B2A4A"/>
<text x="55" y="474" data-semantic-id="node.branch.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">3 · FIRST-LINE OR RELAPSED / REFRACTORY?</tspan></text>
<text x="55" y="509" data-semantic-id="node.branch.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">First line: separate treatment fitness, biological risk and access.</tspan><tspan x="55" dy="21" font-weight="400">Relapse: record prior classes, response, duration and reason for stopping; distinguish intolerance from progression.</tspan></text>
<path d="M500 551 L500 585" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="25" y="585" width="950" height="390" rx="16" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
<text x="45" y="619" data-semantic-id="group.first-line" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#1B2A4A"><tspan x="45" dy="0" font-weight="700">FIRST-LINE ORIENTATION · EVIDENCE DOES NOT CREATE ACCESS</tspan></text>
<rect x="40" y="650" width="286" height="275" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="650" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="678" width="286" height="14" fill="#1B2A4A"/>
<text x="55" y="678" data-semantic-id="node.fit.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">YOUNGER / TREATMENT-FIT</tspan></text>
<text x="55" y="713" data-semantic-id="node.fit.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">TRIANGLE changes the evidence</tspan><tspan x="55" dy="21" font-weight="400">architecture for the studied</tspan><tspan x="55" dy="21" font-weight="400">18–65-year protocol.</tspan><tspan x="55" dy="21" font-weight="400">Adding ASCT did not improve FFS.</tspan><tspan x="55" dy="21" font-weight="400">Licensed ibrutinib regimen;</tspan><tspan x="55" dy="21" font-weight="400">current negative NICE advice is</tspan><tspan x="55" dy="21" font-weight="400">draft.</tspan><tspan x="55" dy="21" font-weight="400">No final national entitlement.</tspan></text>
<rect x="357" y="650" width="286" height="275" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="357" y="650" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="357" y="678" width="286" height="14" fill="#1B2A4A"/>
<text x="372" y="678" data-semantic-id="node.older.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="372" dy="0" font-weight="700">OLDER / TRANSPLANT-INELIGIBLE</tspan></text>
<text x="372" y="713" data-semantic-id="node.older.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="372" dy="0" font-weight="400">Integrate frailty, renal,</tspan><tspan x="372" dy="21" font-weight="400">infection, cardiac, bleeding and</tspan><tspan x="372" dy="21" font-weight="400">interaction risk.</tspan><tspan x="372" dy="21" font-weight="400">ENRICH and ECHO inform evidence.</tspan><tspan x="372" dy="21" font-weight="400">VR-CAP has TA370 only in its exact</tspan><tspan x="372" dy="21" font-weight="400">transplant-unsuitable scope.</tspan><tspan x="372" dy="21" font-weight="400">Confirm every other access route.</tspan></text>
<rect x="674" y="650" width="286" height="275" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="674" y="650" width="286" height="42" rx="14" fill="#C41E3A"/>
<rect x="674" y="678" width="286" height="14" fill="#C41E3A"/>
<text x="689" y="678" data-semantic-id="node.highrisk.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="689" dy="0" font-weight="700">TP53-MUTATED / HIGH RISK</tspan></text>
<text x="689" y="713" data-semantic-id="node.highrisk.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="689" dy="0" font-weight="400">Early specialist and trial</tspan><tspan x="689" dy="21" font-weight="400">discussion.</tspan><tspan x="689" dy="21" font-weight="400">Novel combinations show activity</tspan><tspan x="689" dy="21" font-weight="400">but do not prove comparative</tspan><tspan x="689" dy="21" font-weight="400">superiority or elimination of</tspan><tspan x="689" dy="21" font-weight="400">risk.</tspan><tspan x="689" dy="21" font-weight="400">Do not omit effective maintenance</tspan><tspan x="689" dy="21" font-weight="400">from MRD negativity alone.</tspan></text>
<path d="M500 975 L500 1010" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="25" y="1010" width="950" height="445" rx="16" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
<text x="45" y="1044" data-semantic-id="group.relapsed" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1B2A4A"><tspan x="45" dy="0" font-weight="700">RELAPSED / REFRACTORY · CLASSIFY PRIOR BTKi EXPOSURE AND REASON FOR STOPPING</tspan></text>
<rect x="40" y="1075" width="286" height="320" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="1075" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="1103" width="286" height="14" fill="#1B2A4A"/>
<text x="55" y="1103" data-semantic-id="node.oneline.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">EXACTLY ONE PREVIOUS LINE</tspan></text>
<text x="55" y="1138" data-semantic-id="node.oneline.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">England only, when exact live</tspan><tspan x="55" dy="21" font-weight="400">criteria are met:</tspan><tspan x="55" dy="21" font-weight="400">• ibrutinib TA502</tspan><tspan x="55" dy="21" font-weight="400">• zanubrutinib TA1081</tspan><tspan x="55" dy="21" font-weight="400">The broader licences do not</tspan><tspan x="55" dy="21" font-weight="400">replace the NICE one-line scope.</tspan></text>
<rect x="357" y="1075" width="286" height="320" rx="14" fill="#EAF0F7" stroke="#1B2A4A" stroke-width="2"/>
<rect x="357" y="1075" width="286" height="42" rx="14" fill="#1B2A4A"/>
<rect x="357" y="1103" width="286" height="14" fill="#1B2A4A"/>
<text x="372" y="1103" data-semantic-id="node.intolerance.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="372" dy="0" font-weight="700">COVALENT-BTKi INTOLERANCE</tspan></text>
<text x="372" y="1138" data-semantic-id="node.intolerance.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="372" dy="0" font-weight="400">Stopped for toxicity without</tspan><tspan x="372" dy="21" font-weight="400">progression.</tspan><tspan x="372" dy="21" font-weight="400">Select another clinically</tspan><tspan x="372" dy="21" font-weight="400">appropriate route by retained</tspan><tspan x="372" dy="21" font-weight="400">sensitivity, comorbidity, toxicity</tspan><tspan x="372" dy="21" font-weight="400">and access.</tspan><tspan x="372" dy="21" font-weight="400">Do not call intolerance</tspan><tspan x="372" dy="21" font-weight="400">resistance.</tspan></text>
<rect x="674" y="1075" width="286" height="320" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="674" y="1075" width="286" height="42" rx="14" fill="#C41E3A"/>
<rect x="674" y="1103" width="286" height="14" fill="#C41E3A"/>
<text x="689" y="1103" data-semantic-id="node.progression.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#FFFFFF"><tspan x="689" dy="0" font-weight="700">COVALENT-BTKi PROGRESSION</tspan></text>
<text x="689" y="1138" data-semantic-id="node.progression.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="689" dy="0" font-weight="400">Refer early for cellular-therapy</tspan><tspan x="689" dy="21" font-weight="400">and trial assessment.</tspan><tspan x="689" dy="21" font-weight="400">Pirtobrutinib has post-BTKi</tspan><tspan x="689" dy="21" font-weight="400">activity and a GB licence but no</tspan><tspan x="689" dy="21" font-weight="400">demonstrated national England MCL</tspan><tspan x="689" dy="21" font-weight="400">route at cut-off.</tspan><tspan x="689" dy="21" font-weight="400">Do not transpose CLL funding.</tspan></text>
<path d="M817 1395 L817 1440 L262 1440 L262 1485" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M817 1440 L738 1440 L738 1485" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="1485" width="445" height="220" rx="14" fill="#EAF4ED" stroke="#1B2A4A" stroke-width="2"/>
<rect x="40" y="1485" width="445" height="42" rx="14" fill="#1B2A4A"/>
<rect x="40" y="1513" width="445" height="14" fill="#1B2A4A"/>
<text x="55" y="1513" data-semantic-id="node.ta677.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">TA677 CDF MANAGED ACCESS</tspan></text>
<text x="55" y="1548" data-semantic-id="node.ta677.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">Brexucabtagene autoleucel after at least two systemic</tspan><tspan x="55" dy="21" font-weight="400">lines including a BTKi.</tspan><tspan x="55" dy="21" font-weight="400">England route remains Cancer Drugs Fund managed access</tspan><tspan x="55" dy="21" font-weight="400">with live national and panel criteria.</tspan><tspan x="55" dy="21" font-weight="400">Do not describe as unrestricted baseline commissioning.</tspan></text>
<rect x="515" y="1485" width="445" height="220" rx="14" fill="#FFF7E6" stroke="#C41E3A" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="515" y="1485" width="445" height="42" rx="14" fill="#C41E3A"/>
<rect x="515" y="1513" width="445" height="14" fill="#C41E3A"/>
<text x="530" y="1513" data-semantic-id="node.nonroutine.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="530" dy="0" font-weight="700">TRIAL / EARLY / EXCEPTIONAL ROUTES</tspan></text>
<text x="530" y="1548" data-semantic-id="node.nonroutine.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="530" dy="0" font-weight="400">Licensed, no demonstrated national route: pirtobrutinib</tspan><tspan x="530" dy="21" font-weight="400">and liso-cel, each within its exact indication.</tspan><tspan x="530" dy="21" font-weight="400">No current MCL licence: bispecific options.</tspan><tspan x="530" dy="21" font-weight="400">Every option requires exact live route confirmation.</tspan><tspan x="530" dy="21" font-weight="400">No national route does not prove absolute</tspan><tspan x="530" dy="21" font-weight="400">unavailability, but non-routine access must never be</tspan><tspan x="530" dy="21" font-weight="400">implied.</tspan></text>
<path d="M500 1705 L500 1735" stroke="#1B2A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="1735" width="920" height="205" rx="14" fill="#FBECEF" stroke="#C41E3A" stroke-width="2"/>
<rect x="40" y="1735" width="920" height="42" rx="14" fill="#C41E3A"/>
<rect x="40" y="1763" width="920" height="14" fill="#C41E3A"/>
<text x="55" y="1763" data-semantic-id="node.safety.title" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#FFFFFF"><tspan x="55" dy="0" font-weight="700">PHARMACY AND SUPPORTIVE-CARE HOLD POINT</tspan></text>
<text x="55" y="1798" data-semantic-id="node.safety.body" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#1F2937"><tspan x="55" dy="0" font-weight="400">Use current SmPC and local SACT protocol for formulation, dose, schedule, modifications and administration.</tspan><tspan x="55" dy="21" font-weight="400">Assess infection, vaccination, viral screening, interactions, bleeding, cardiac, renal and tumour-lysis risk.</tspan><tspan x="55" dy="21" font-weight="400">Use dedicated CAR-T and bispecific toxicity pathways. Human pharmacy verification remains mandatory.</tspan><tspan x="55" dy="21" font-weight="400">Clinical and pharmacy review pending — no publication authority.</tspan></text>
<text x="40" y="1980" data-semantic-id="footer.cut-off" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#5B6472"><tspan x="40" dy="0" font-weight="400">Evidence/access cut-off 28 July 2026 · England access framework with separate devolved-nation notes.</tspan></text>
<text x="40" y="2012" data-semantic-id="footer.warning" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#C41E3A"><tspan x="40" dy="0" font-weight="700">CONTROLLED WORKING PREVIEW — do not use for treatment, prescribing, consent, referral or commissioning.</tspan></text>
</svg>
