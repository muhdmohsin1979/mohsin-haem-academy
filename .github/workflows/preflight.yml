name: preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tone-guard:
    name: tone guard (banned words)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute BASE / HEAD SHAs
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Generate unified diff (added lines only, excluding docs/templates)
        run: |
          # docs/templates/* contain FILL IN placeholder text which would
          # false-positive the tone guard. They are not published pages.
          git diff --unified=0 -M \
            "${{ steps.sha.outputs.base }}" "${{ steps.sha.outputs.head }}" \
            -- . ':(exclude)docs/templates/**' \
            > pr.diff
          echo "diff size: $(wc -l < pr.diff) lines"

      - name: Run tone guard (diff mode — added lines only)
        run: |
          python scripts/tone_guard.py --diff-from pr.diff

  preflight:
    name: preflight (PII + link check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run preflight self-test (PII regex regressions)
        run: |
          python scripts/preflight.py --self-test

      - name: Run repository-wide PII and internal-link checks
        run: |
          git ls-files '*.html' \
            | grep -vE '^docs/templates/' > all-html.txt
          python scripts/preflight.py --files-from all-html.txt --skip-links

      - name: Validate deployment routing files
        run: |
          python -m json.tool _routes.json > /dev/null
          cp _worker.js /tmp/mha-worker.mjs
          node --check /tmp/mha-worker.mjs

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          # Scan .md and .html, but SKIP docs/templates/* — those files
          # contain placeholder URLs and FILL IN markers that would fail
          # the link and PII checks for no real reason (they are not
          # served). Authors start from these files but the output is
          # always placed under /guidelines/<topic>/ and gets its own scan.
          git diff --name-only --diff-filter=AM "$BASE" "$HEAD" \
            | grep -Ei '\.(md|html)$' \
            | grep -vE '^docs/templates/' > changed.txt || true
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Compute BASE / HEAD SHAs
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Generate unified diff for external link check
        run: |
          git diff --unified=0 -M \
            "${{ steps.sha.outputs.base }}" "${{ steps.sha.outputs.head }}" \
            -- . ':(exclude)docs/templates/**' \
            > pr.diff

      - name: Run preflight (diff mode for external link check)
        if: steps.changed.outputs.count != '0'
        run: |
          python scripts/preflight.py \
            --files-from changed.txt \
            --diff-from pr.diff

  mcl-containment-gate:
    name: MCL withdrawal containment gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fail-closed MCL withdrawal state
        run: python scripts/validate_mcl_containment.py

  cll-v2-release-gate:
    name: CLL v2 controlled release gate
    # The controlled PDFs were generated with the current macOS LibreOffice
    # build and system fonts. Use the same rendering family in CI so the
    # pagination gate tests the release process rather than Linux font fallbacks.
    runs-on: macos-15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install controlled-document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 pymupdf python-docx
          brew install --cask libreoffice

      - name: Install isolated official Excalidraw renderer
        run: |
          mkdir -p /tmp/cll-excal-renderer
          npm install --prefix /tmp/cll-excal-renderer --ignore-scripts --no-save \
            @excalidraw/excalidraw@0.18.1 esbuild@0.25.0 playwright@1.54.1
          /tmp/cll-excal-renderer/node_modules/.bin/playwright install chromium

      - name: Validate approval-bound CLL artefacts and reproducibility
        run: |
          python scripts/validate_cll_v2_release.py

      - name: Render and inspect exact editable algorithm through official Excalidraw
        env:
          NODE_PATH: /tmp/cll-excal-renderer/node_modules
          CLL_EXCAL_NODE_ROOT: /tmp/cll-excal-renderer
        run: |
          node scripts/validate_cll_excalidraw.cjs
