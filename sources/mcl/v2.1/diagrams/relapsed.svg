<svg class="pathway" viewBox="0 0 1020 1387" role="img" aria-labelledby="algo-rr-t algo-rr-d" xmlns="http://www.w3.org/2000/svg">
<title id="algo-rr-t">Relapsed or refractory treatment algorithm for mantle cell lymphoma</title>
<desc id="algo-rr-d">Decision flow from confirmed relapse, branching on prior covalent BTK-inhibitor exposure, through commissioned options, cellular therapy, licensed options without a route, and trial routes, each labelled with its England access class.</desc>
<defs><marker id="algo-rr-ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L7.5,3.2 z" fill="#1B2A4A"/></marker></defs>
<rect width="1020" height="1387" fill="#F7F8FA"/>
<rect x="210.0" y="14.0" width="600.0" height="88.5" rx="8" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="1"/>
<text x="221.0" y="31.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="white">Relapse or progression confirmed</text>
<text x="221.0" y="47.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#dfe6f2">Record prior regimens and classes, depth and duration of response, reason for stopping, disease</text>
<text x="221.0" y="61.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#dfe6f2">tempo, organ function, infection history and access constraints. Re-biopsy where transformation is</text>
<text x="221.0" y="76.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#dfe6f2">suspected.</text>
<line x1="510.0" y1="102.5" x2="510.0" y2="130.5" stroke="#1B2A4A" stroke-width="2" marker-end="url(#algo-rr-ah)"/>
<rect x="235.0" y="134.5" width="550.0" height="74.0" rx="8" fill="#fdf8ee" stroke="#b08538" stroke-width="2"/>
<text x="246.0" y="151.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Has the patient already had a covalent BTK inhibitor?</text>
<text x="246.0" y="167.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Distinguish intolerance from progression — the two lead to different places. Intolerance may</text>
<text x="246.0" y="182.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">permit a within-class switch; progression does not.</text>
<rect x="24.0" y="254.5" width="468.0" height="26" rx="6" fill="#1B2A4A"/><text x="258.0" y="272.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white">BTK-inhibitor naive</text>
<rect x="528.0" y="254.5" width="468.0" height="26" rx="6" fill="#1B2A4A"/><text x="762.0" y="272.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white">Progression on a covalent BTK inhibitor</text>
<path d="M 410.0 208.5 V 229.5 H 258.0 V 250.5" fill="none" stroke="#1B2A4A" stroke-width="2" marker-end="url(#algo-rr-ah)"/>
<rect x="323.4" y="222.0" width="21.2" height="15" rx="7" fill="white" stroke="#D7DCE2"/>
<text x="334.0" y="233.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#1B2A4A">no</text>
<path d="M 610.0 208.5 V 229.5 H 762.0 V 250.5" fill="none" stroke="#1B2A4A" stroke-width="2" marker-end="url(#algo-rr-ah)"/>
<rect x="672.6" y="222.0" width="26.8" height="15" rx="7" fill="white" stroke="#D7DCE2"/>
<text x="686.0" y="233.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#1B2A4A">yes</text>
<rect x="24.0" y="294.5" width="468.0" height="149.5" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="35.0" y="311.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">After exactly one previous line — ibrutinib or zanubrutinib</text>
<text x="35.0" y="327.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">TA1081 directs use of the least expensive of the suitable treatments, naming</text>
<text x="35.0" y="342.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">zanubrutinib and ibrutinib, after discussion of advantages and disadvantages</text>
<text x="35.0" y="356.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">with the patient.</text>
<text x="35.0" y="371.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">TA502 covers ibrutinib after one previous line. Both subject to their</text>
<text x="35.0" y="385.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">commercial arrangements and live Blueteq criteria. Intolerance transfer</text>
<text x="35.0" y="400.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">requires absence of progression.</text>
<circle cx="39.6" cy="410.5" r="4.6" fill="#2e6b3e"/>
<text x="50.0" y="414.5" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#2e6b3e">Routine NHS England commissioning</text>
<rect x="24.0" y="460.0" width="468.0" height="106.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="35.0" y="477.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Acalabrutinib monotherapy</text>
<text x="35.0" y="493.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">GB-licensed for relapsed or refractory disease not previously treated with a</text>
<text x="35.0" y="507.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">BTK inhibitor. NICE GID-TA11470 awaiting development, timelines to be</text>
<text x="35.0" y="522.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">confirmed. No national route.</text>
<circle cx="39.6" cy="532.5" r="4.6" fill="#8b2e2e"/>
<text x="50.0" y="536.5" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#8b2e2e">Licensed; no demonstrated routine route</text>
<line x1="258.0" y1="444.0" x2="258.0" y2="460.0" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="24.0" y="582.0" width="468.0" height="103.0" rx="8" fill="#fff1f3" stroke="#C41E3A" stroke-width="2"/>
<text x="35.0" y="599.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#8b2e2e">Plan the next line before you need it</text>
<text x="35.0" y="615.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Median survival after stopping first-line ibrutinib in the England COVID-</text>
<text x="35.0" y="629.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">scheme cohort was 1.4 months — 8.6 months where subsequent treatment was</text>
<text x="35.0" y="644.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">given, 0.6 months where it was not. Identify the next option and assess</text>
<text x="35.0" y="658.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">cellular-therapy eligibility early.</text>
<line x1="258.0" y1="566.0" x2="258.0" y2="582.0" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="528.0" y="294.5" width="468.0" height="106.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="311.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Assess cellular-therapy eligibility and refer early</text>
<text x="539.0" y="327.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Manufacturing time and bridging risk are part of the decision. UK intention-</text>
<text x="539.0" y="342.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">to-treat data record material attrition between approval and infusion, and</text>
<text x="539.0" y="356.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">24-month non-relapse mortality of 25%, mainly infection.</text>
<circle cx="543.6" cy="367.0" r="4.6" fill="#707070"/>
<text x="554.0" y="371.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#707070">Assessment step</text>
<rect x="528.0" y="416.5" width="468.0" height="164.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="433.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Brexucabtagene autoleucel</text>
<text x="539.0" y="449.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">ZUMA-2 cohort 1: median duration of response 36.5 months at 67.8 months</text>
<text x="539.0" y="464.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">follow-up. Cohort 3 in BTKi-naive disease: response 91%, complete response</text>
<text x="539.0" y="478.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">73%.</text>
<text x="539.0" y="493.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">TA677 managed access remains live, forms KTE01a and KTE01b. The June 2026</text>
<text x="539.0" y="507.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">appeal was upheld in part and the appraisal was remitted to committee. No</text>
<text x="539.0" y="522.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">final review guidance has been issued. Confirm live CDF and Blueteq</text>
<text x="539.0" y="536.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">eligibility before referral.</text>
<circle cx="543.6" cy="547.0" r="4.6" fill="#b08538"/>
<text x="554.0" y="551.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#b08538">Managed access — CDF; post-review position unresolved</text>
<line x1="762.0" y1="400.5" x2="762.0" y2="416.5" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="528.0" y="596.5" width="468.0" height="135.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="613.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Pirtobrutinib</text>
<text x="539.0" y="629.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">BRUIN: response 57.8%, median duration of response 21.6 months. Single-arm.</text>
<text x="539.0" y="644.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Official NICE status is internally inconsistent — see the access matrix. A</text>
<text x="539.0" y="658.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">second appraisal covers a BTKi-untreated population. A registered individual-</text>
<text x="539.0" y="673.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">patient expanded access programme exists. Do not transpose the CLL route —</text>
<text x="539.0" y="687.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">that is a different indication.</text>
<circle cx="543.6" cy="698.0" r="4.6" fill="#8b2e2e"/>
<text x="554.0" y="702.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#8b2e2e">Licensed; no demonstrated routine route</text>
<line x1="762.0" y1="580.5" x2="762.0" y2="596.5" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="528.0" y="747.5" width="468.0" height="106.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="764.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Lisocabtagene maraleucel</text>
<text x="539.0" y="780.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Phase I: response 83.1% among 88 infused. GB-licensed after at least two</text>
<text x="539.0" y="795.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">lines including a BTK inhibitor. NICE GID-TA11930 awaiting development. No</text>
<text x="539.0" y="809.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">head-to-head against brexu-cel.</text>
<circle cx="543.6" cy="820.0" r="4.6" fill="#8b2e2e"/>
<text x="554.0" y="824.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#8b2e2e">Licensed; no demonstrated routine route</text>
<line x1="762.0" y1="731.5" x2="762.0" y2="747.5" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="528.0" y="869.5" width="468.0" height="149.5" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="886.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">Trial routes — often the only route</text>
<text x="539.0" y="902.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">GLOFITAMAB: no GB mantle cell licence. GLOBRYTE phase III recruiting at</text>
<text x="539.0" y="917.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Glasgow, Lincoln, London, Manchester, Oxford and Plymouth.</text>
<text x="539.0" y="931.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">SONROTOCLAX: US-approved May 2026, no GB licence. CELESTIAL-RRMCL phase III</text>
<text x="539.0" y="946.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">recruiting at Glasgow, Oxford, Wirral, Plymouth, Bournemouth and London.</text>
<text x="539.0" y="960.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Both are randomised, so a patient may receive the comparator. Say so at</text>
<text x="539.0" y="975.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">consent.</text>
<circle cx="543.6" cy="985.5" r="4.6" fill="#707070"/>
<text x="554.0" y="989.5" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#707070">Clinical trial</text>
<line x1="762.0" y1="853.5" x2="762.0" y2="869.5" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="528.0" y="1035.0" width="468.0" height="193.0" rx="8" fill="white" stroke="#D7DCE2" stroke-width="1"/>
<text x="539.0" y="1052.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1B2A4A">After CAR-T failure — the pathway does not stop here</text>
<text x="539.0" y="1068.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">EBMT 2026 guidance: no role for repeat CD19-directed CAR-T once CAR-T-</text>
<text x="539.0" y="1082.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">exposed.</text>
<text x="539.0" y="1097.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">ALLOGENEIC HCT is a clinical option in salvage-sensitive patients. It is the</text>
<text x="539.0" y="1111.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">only remaining modality with curative intent, evidence is limited and largely</text>
<text x="539.0" y="1126.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">extrapolated from large B-cell lymphoma, and outcomes in this heavily</text>
<text x="539.0" y="1140.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">pretreated group are poor. Discuss with a transplant centre before CAR-T, not</text>
<text x="539.0" y="1155.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">after it fails.</text>
<text x="539.0" y="1169.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Bispecific antibody or trial entry are the alternatives — 26% of patients in</text>
<text x="539.0" y="1184.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">the mosunetuzumab with polatuzumab study had prior CAR-T.</text>
<circle cx="543.6" cy="1194.5" r="4.6" fill="#707070"/>
<text x="554.0" y="1198.5" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#707070">Trial or specialist transplant decision</text>
<line x1="762.0" y1="1019.0" x2="762.0" y2="1035.0" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="24.0" y="1252.0" width="972.0" height="117.5" rx="8" fill="#fff1f3" stroke="#C41E3A" stroke-width="2"/>
<text x="35.0" y="1269.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#8b2e2e">Do not rank these options against one another</text>
<text x="35.0" y="1285.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">No head-to-head randomised comparison exists between pirtobrutinib, cellular therapy, bispecific antibodies and BCL2 inhibition. Unadjusted cross-trial response rates</text>
<text x="35.0" y="1299.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">must not be used to construct a hierarchy.</text>
<text x="35.0" y="1314.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">Ibrutinib with venetoclax has randomised phase III evidence in this setting — median PFS 31.9 versus 22.1 months, hazard ratio 0.65 (CORRECTION_UNRESOLVED: a</text>
<text x="35.0" y="1328.5" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">published correction exists against this report and its content has not been retrieved) — and no GB mantle cell licence and no route. Strong evidence and no access</text>
<text x="35.0" y="1343.0" font-family="Arial,Helvetica,sans-serif" font-size="11.0" fill="#172033">are not a contradiction; record them separately.</text>
</svg>